# Render blueprint: connect the GitHub repo, and Render deploys on every push.
services:
  - type: web
    name: jerd-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LATEST_VERSION
        value: 0.1.0
      - key: LATEST_BUILD
        value: "1"
      - key: MIN_BUILD
        value: "1"
      - key: APK_URL
        sync: false

  - type: cron
    name: jerd-nightly-digest
    runtime: python
    rootDir: backend
    schedule: "0 19 * * *" # 20:00 in Algeria (UTC+1)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.nightly_digest
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
