# Render blueprint: connect the GitHub repo, and Render deploys on every push.
# Free plan only. Render cron jobs are paid, so the nightly digest is triggered
# by GitHub Actions instead (.github/workflows/nightly-digest.yml).
services:
  - type: web
    name: jerd-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LATEST_VERSION
        value: 0.1.0
      - key: LATEST_BUILD
        value: "1"
      - key: MIN_BUILD
        value: "1"
      - key: APK_URL
        sync: false
