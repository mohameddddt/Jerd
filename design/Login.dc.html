<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FAF5EE; font-family: "Rubik", system-ui, "Segoe UI", sans-serif; color: #2A221D; }
    * { box-sizing: border-box; }
    a { color: #B85C38; } a:hover { color: #8E3F22; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF5EE; display: flex; flex-direction: column; overflow: hidden; padding: 0 24px 32px;">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-top: 40px;">
    <div style="width: 96px; height: 96px; border-radius: 32px; background: #B85C38; color: #FFF8F2; display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 700; box-shadow: 0 10px 24px rgba(140, 60, 25, 0.25);">جرد</div>
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.5px;">Jerd</div>
    <div style="font-size: 17px; color: #7B6D62; text-align: center; line-height: 1.4; text-wrap: pretty;">Count your stock,<br>even with no signal.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="font-size: 22px; font-weight: 600;">Sign in</div>

    <div style="position: relative; height: 58px; border: 1.5px solid #D9CBBB; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #FFFCF8;">
      <span style="position: absolute; top: -10px; left: 12px; background: #FAF5EE; padding: 0 5px; font-size: 13px; color: #7B6D62;">Email</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A8B7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2"></rect><path d="M4 7l8 6 8-6"></path></svg>
      <span style="font-size: 16px;">karim@example.com</span>
    </div>

    <div style="position: relative; height: 58px; border: 2px solid #B85C38; border-radius: 16px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #FFFCF8;">
      <span style="position: absolute; top: -10px; left: 12px; background: #FAF5EE; padding: 0 5px; font-size: 13px; color: #B85C38; font-weight: 500;">Password</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A8B7F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      <span style="flex: 1; font-size: 18px; letter-spacing: 3px;">••••••••</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B6D62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </div>

    <div style="height: 60px; border-radius: 20px; background: #B85C38; color: #FFF8F2; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; margin-top: 4px;">Sign in</div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 14px; color: #7B6D62;">
      <span style="color: #B85C38; font-weight: 500; padding: 10px;">Forgot password?</span>
      <span>No account? Ask your shop owner to add you.</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
