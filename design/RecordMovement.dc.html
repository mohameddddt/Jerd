<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #FAF5EE; font-family: "Rubik", system-ui, "Segoe UI", sans-serif; color: #2A221D; }
    * { box-sizing: border-box; }
    a { color: #B85C38; } a:hover { color: #8E3F22; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAF5EE; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px;">
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
    <span style="font-size: 20px; font-weight: 600;">Record movement</span>
  </div>

  <div style="margin: 4px 16px 0; background: #FFFCF8; border: 1px solid #EFE5D8; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: #EFE3C8; color: #7A5A16; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 19px;">O</div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 16px; font-weight: 500;">Olive oil 1L</span><span style="font-size: 13px; color: #7B6D62;">Now in stock: 3 bottles</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 18px 16px 0;">
    <div style="height: 64px; border-radius: 18px; background: #3E8A57; color: #F4FBF5; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Received
    </div>
    <div style="height: 64px; border-radius: 18px; background: #FFFCF8; border: 1px solid #E8DCCD; color: #9E3328; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg>Sold
    </div>
    <div style="height: 64px; border-radius: 18px; background: #FFFCF8; border: 1px solid #E8DCCD; color: #5C4F45; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600;">Adjust</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 30px 16px 0;">
    <span style="font-size: 15px; color: #7B6D62;">How many bottles arrived?</span>
    <div style="display: flex; align-items: center; gap: 22px;">
      <div style="width: 68px; height: 68px; border-radius: 34px; background: #F3EBE1; color: #2A221D; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></div>
      <div style="width: 130px; height: 96px; border-radius: 24px; background: #FFFCF8; border: 2px solid #3E8A57; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: 600; font-variant-numeric: tabular-nums; color: #2F6E44;">12</div>
      <div style="width: 68px; height: 68px; border-radius: 34px; background: #F3EBE1; color: #2A221D; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></div>
    </div>
    <div style="display: flex; gap: 8px;">
      <div style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 22px; border: 1px solid #E8DCCD; background: #FFFCF8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500;">+1</div>
      <div style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 22px; border: 1px solid #E8DCCD; background: #FFFCF8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500;">+6</div>
      <div style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 22px; border: 1px solid #3E8A57; background: #E2F0E4; color: #2F6E44; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">+12</div>
      <div style="height: 44px; min-width: 64px; padding: 0 14px; border-radius: 22px; border: 1px solid #E8DCCD; background: #FFFCF8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500;">+24</div>
    </div>
  </div>

  <div style="margin: 26px 16px 0; border-radius: 20px; background: #F3EBE1; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 15px; color: #5C4F45;">Stock after saving</span>
    <div style="display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums;">
      <span style="font-size: 20px; color: #7B6D62;">3</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7B6D62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      <span style="font-size: 24px; font-weight: 600; color: #2F6E44;">15</span>
    </div>
  </div>

  <div style="position: relative; margin: 26px 16px 0; height: 58px; border: 1.5px solid #D9CBBB; border-radius: 16px; display: flex; align-items: center; padding: 0 16px; background: #FFFCF8;">
    <span style="position: absolute; top: -10px; left: 12px; background: #FAF5EE; padding: 0 5px; font-size: 13px; color: #7B6D62;">Note (optional)</span>
    <span style="font-size: 16px; color: #A99A8E;">e.g. delivery from supplier</span>
  </div>

  <div style="flex: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px 24px;">
    <div style="height: 62px; border-radius: 20px; background: #3E8A57; color: #F4FBF5; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Save · received 12
    </div>
    <span style="font-size: 13px; color: #7B6D62; text-align: center;">Saved on this phone right away. It syncs when you're online.</span>
  </div>

</div>
</x-dc>
</body>
</html>
