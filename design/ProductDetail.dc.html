<!doctype html>
<html>
<head>

  <script src="./support.js"></script>
</head>
<body>
<x-dc>

  <style>

    a { color: #B85C38; } a:hover { color: #8E3F22; }

<div style="width: 390px; height: 844px; background: #FAF5EE; display: flex; flex-direction: column; overflow: hidden;">

    <div style="display: flex; gap: 4px;">
      <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></div>
      <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="12" cy="19" r="1.8"></circle></svg></div>
    </div>
  </div>

  <div style="display: flex; gap: 16px; align-items: center; padding: 0 20px;">
    <div style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 26px; background: #EFE3C8; color: #A08040; display: flex; align-items: center; justify-content: center;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M20.5 16l-5-5L6 19.5"></path></svg>

    <div style="display: flex; flex-direction: column; gap: 6px;">

      <div style="font-size: 14px; color: #7B6D62; font-variant-numeric: tabular-nums;">6130000100010</div>
    </div>
  </div>

  <div style="margin: 18px 16px 0; background: #FFFCF8; border: 1px solid #EFE5D8; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; color: #7B6D62;">In stock</span>
        <div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 56px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; color: #A8700F;">3</span><span style="font-size: 18px; color: #7B6D62;">bottles</span></div>
      </div>
      <span style="font-size: 13px; font-weight: 500; color: #7A5410; background: #F9EDD2; padding: 6px 12px; border-radius: 12px;">Low stock</span>
    </div>
    <div style="height: 8px; border-radius: 4px; background: #F3EBE1; overflow: hidden;"><div style="width: 50%; height: 100%; background: #C98A1E; border-radius: 4px;"></div></div>
    <div style="font-size: 14px; color: #7B6D62;">Reorder when it reaches <b style="color: #2A221D; font-weight: 600;">6</b></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 16px 0;">
    <div style="height: 72px; border-radius: 20px; background: #E2F0E4; color: #2F6E44; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Received
    </div>
    <div style="height: 72px; border-radius: 20px; background: #F8E1DD; color: #9E3328; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg>Sold
    </div>
    <div style="height: 72px; border-radius: 20px; background: #F3EBE1; color: #5C4F45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 15px; font-weight: 600;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>Adjust
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 6px;">
    <span style="font-size: 18px; font-weight: 600;">History</span>
    <span style="font-size: 14px; color: #B85C38; font-weight: 500;">See all</span>
  </div>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 0 16px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #EFE5D8;">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F8E1DD; color: #9E3328; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 500;">Sold 1</span><span style="font-size: 13px; color: #7B6D62;">Today 10:05 · Amina</span></div>
      <span style="font-size: 14px; color: #7B6D62; font-variant-numeric: tabular-nums;">→ 3</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #EFE5D8;">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F8E1DD; color: #9E3328; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 500;">Sold 4</span><span style="font-size: 13px; color: #7B6D62;">Today 08:40 · Karim</span></div>
      <span style="font-size: 14px; color: #7B6D62; font-variant-numeric: tabular-nums;">→ 4</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #EFE5D8;">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F3EBE1; color: #5C4F45; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 500;">Adjusted −2 · 2 bottles broken</span><span style="font-size: 13px; color: #7B6D62;">Yesterday 17:20 · Karim</span></div>
      <span style="font-size: 14px; color: #7B6D62; font-variant-numeric: tabular-nums;">→ 8</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 10px 4px;">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #E2F0E4; color: #2F6E44; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg></div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 15px; font-weight: 500;">Received 10</span><span style="font-size: 13px; color: #7B6D62;">Mon 09:12 · Karim</span></div>
      <span style="font-size: 14px; color: #7B6D62; font-variant-numeric: tabular-nums;">→ 10</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
