<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #1E1916; font-family: "Rubik", system-ui, "Segoe UI", sans-serif; color: #2A221D; }
    * { box-sizing: border-box; }
    a { color: #B85C38; } a:hover { color: #8E3F22; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #1E1916; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: #FBF4EC;">
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
    <span style="font-size: 18px; font-weight: 600;">Scan barcode</span>
    <div style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; background: rgba(255, 248, 240, 0.12);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg></div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 22px; padding-top: 70px;">
    <div style="position: relative; width: 290px; height: 190px; display: flex; align-items: center; justify-content: center;">
      <svg width="290" height="190" viewBox="0 0 290 190" fill="none" stroke="#E8875C" stroke-width="5" stroke-linecap="round" style="position: absolute; inset: 0;"><path d="M4 40V20a16 16 0 0 1 16-16h20"></path><path d="M250 4h20a16 16 0 0 1 16 16v20"></path><path d="M286 150v20a16 16 0 0 1-16 16h-20"></path><path d="M40 186H20a16 16 0 0 1-16-16v-20"></path></svg>
      <svg width="190" height="90" viewBox="0 0 190 90" fill="#FBF4EC" style="opacity: 0.85;"><rect x="0" y="0" width="6" height="90"></rect><rect x="10" y="0" width="3" height="90"></rect><rect x="17" y="0" width="8" height="90"></rect><rect x="29" y="0" width="3" height="90"></rect><rect x="36" y="0" width="5" height="90"></rect><rect x="46" y="0" width="3" height="90"></rect><rect x="53" y="0" width="9" height="90"></rect><rect x="66" y="0" width="3" height="90"></rect><rect x="73" y="0" width="5" height="90"></rect><rect x="82" y="0" width="7" height="90"></rect><rect x="93" y="0" width="3" height="90"></rect><rect x="100" y="0" width="6" height="90"></rect><rect x="110" y="0" width="3" height="90"></rect><rect x="117" y="0" width="8" height="90"></rect><rect x="129" y="0" width="4" height="90"></rect><rect x="137" y="0" width="3" height="90"></rect><rect x="144" y="0" width="7" height="90"></rect><rect x="155" y="0" width="3" height="90"></rect><rect x="162" y="0" width="5" height="90"></rect><rect x="171" y="0" width="3" height="90"></rect><rect x="178" y="0" width="7" height="90"></rect><rect x="188" y="0" width="2" height="90"></rect></svg>
      <div style="position: absolute; left: 20px; right: 20px; top: 94px; height: 3px; border-radius: 2px; background: #E8875C; box-shadow: 0 0 12px rgba(232, 135, 92, 0.8);"></div>
    </div>
    <span style="font-size: 16px; color: #D9CCC0;">Point the camera at the barcode</span>
    <div style="height: 48px; padding: 0 20px; border-radius: 24px; border: 1px solid rgba(251, 244, 236, 0.35); color: #FBF4EC; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h15M4 15h15M10 4l-2 16M16 4l-2 16"></path></svg>Type the number instead
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFCF8; border-radius: 30px 30px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px;">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DDD0C2;"></div>
    <div style="display: flex; align-items: center; gap: 8px; color: #2F6E44; font-size: 14px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Found
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 56px; height: 56px; border-radius: 16px; background: #EFE3C8; color: #7A5A16; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 21px;">O</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><span style="font-size: 19px; font-weight: 600;">Olive oil 1L</span><span style="font-size: 14px; color: #7B6D62;">3 bottles in stock</span></div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7B6D62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="height: 60px; border-radius: 18px; background: #F8E1DD; color: #9E3328; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path></svg>Sold
      </div>
      <div style="height: 60px; border-radius: 18px; background: #3E8A57; color: #F4FBF5; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Received
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
