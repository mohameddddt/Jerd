name: jerd
description: "Jerd — offline-first stock control for a small shop."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  equatable: ^2.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  logger: ^2.8.0
  mobile_scanner: ^7.4.2
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: 12.0.1
  sentry_flutter: ^9.30.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-400.ttf
          weight: 400
        - asset: assets/fonts/Rubik-500.ttf
          weight: 500
        - asset: assets/fonts/Rubik-600.ttf
          weight: 600
        - asset: assets/fonts/Rubik-700.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#B85C38"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 24
